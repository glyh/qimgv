name: linux

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: debian 13 / Qt 6.8.2 / clang
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git xz-utils zstd \
            pkg-config clang \
            qt6-base-dev qt6-base-dev-tools qt6-svg-dev qt6-l10n-tools \
            libexiv2-dev libmpv-dev libopencv-dev \
            libgl1-mesa-dev libglu1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev \
            libx11-dev libx11-xcb-dev \
            libxcb-cursor-dev libxcb-icccm4-dev libxcb-image0-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-xinerama0-dev \
            libxcb-xkb-dev zlib1g-dev

      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0

      # opencv=true is what qimgv/distrib/PKGBUILD builds with; the OpenCV scaler path
      # is not exercised on the dev machine, so this is the only place it compiles.
      - name: Build
        run: zig build -Doptimize=ReleaseFast -Dopencv=true

      - name: Package
        run: tar -caf qimgv-linux-x86_64.tar.zst zig-out

      - uses: actions/upload-artifact@v4
        with:
          name: qimgv-linux-x86_64
          path: qimgv-linux-x86_64.tar.zst
