name: windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # UCRT64, not MINGW64: MSYS2 no longer builds exiv2 or mpv for the msvcrt
    # environment, and it has deprecated MINGW64 outright.
    name: MSYS2 / UCRT64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          # setup-msys2's default 'minimal' path-type rebuilds PATH from the MSYS2
          # defaults, which hides the zig that mlugg/setup-zig put on the runner PATH.
          path-type: inherit
          update: true
          install: >-
            git
            p7zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-exiv2
            mingw-w64-ucrt-x86_64-mpv

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0

      - name: Build and package
        run: ./scripts/build-qimgv.sh

      - uses: actions/upload-artifact@v4
        with:
          name: qimgv-x64
          path: qimgv-x64.7z

  release:
    name: publish latest-dev
    needs: build
    # Only master: a pull_request ref must never publish, and a dispatch from a feature
    # branch must not either.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qimgv-x64

      - uses: softprops/action-gh-release@v2
        with:
          files: qimgv-x64.7z
          prerelease: true
          tag_name: latest-dev
          name: ${{ github.sha }}
          body: "Automated build from ${{ github.sha }}"
